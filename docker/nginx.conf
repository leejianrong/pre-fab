# Fronts apps/editor at a stable hostname so only nginx's own host port
# needs to be free on a laptop running several projects' dev stacks at
# once — editor no longer publishes its own host port at all.
server {
  listen 80;
  server_name pre-fab.localhost;

  location / {
    proxy_pass http://editor:5173;
    # Hardcoded, not $host: Vite's plain HTTP allowedHosts check only looks
    # at the hostname, but its HMR websocket upgrade separately validates
    # Host as hostname:port against its own listening port (5173) — $host
    # strips the port nginx received the request on, which fails that check
    # with a bare 400 (no server-side log) rather than an obvious error.
    proxy_set_header Host pre-fab.localhost:5173;
    # Vite's dev server pushes HMR updates over a websocket back to the
    # page; without the upgrade headers it silently falls back to full
    # reloads (or nothing), not an obvious error.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
