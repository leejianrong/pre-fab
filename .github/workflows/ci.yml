name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # scripts/db-init.sql creates these; CI just points every DATABASE_URL at
  # the postgres: service container instead of a local cluster.
  MIGRATE_DATABASE_URL: postgres://prefab:prefab@localhost:5432/prefab_test
  MIGRATE_DATABASE_URL_TEST: postgres://prefab:prefab@localhost:5432/prefab_test
  DATABASE_URL: postgres://prefab_app:prefab_app@localhost:5432/prefab_test
  DATABASE_URL_TEST: postgres://prefab_app:prefab_app@localhost:5432/prefab_test

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run typecheck

  # The two CI containment checks (ADR-0004, ADR-0007) and the R12 parity
  # conformance test (ADR-0003) — SLICES.md names these as slice 1's CI
  # deliverables, run as their own job so a containment break is never
  # buried in a wall of unit-test output.
  containment-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run ci:containment
      - run: pnpm run ci:parity

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run test:unit

  # Real Postgres with RLS active (ADR-0008) — the cross-tenant-read and
  # RLS-insert-rejection tests are meaningless against a mock.
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Create prefab/prefab_app roles and the test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db-init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE prefab_test OWNER prefab;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d prefab_test -c "GRANT CONNECT ON DATABASE prefab_test TO prefab_app;"
      - run: pnpm run test:integration

  # SLICES.md Slice 3: "Lighthouse and axe-core budgets in CI, per
  # template" (R3, R6). No Postgres needed — each template's bundle is
  # built and served standalone, straight from @prefab/templates' checkout
  # files, the same way tools/checks' other checks never boot a database.
  # Its own job for the same reason containment-and-parity is: a budget
  # regression should never be buried in a wall of other output.
  template-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright's Chromium
        run: pnpm --filter @prefab/ci-checks exec playwright install --with-deps chromium
      - run: pnpm run ci:budgets

  # SLICES.md Slice 7: "screenshot-diff fidelity harness" (R9) — every
  # first-party block, rendered by the hosted pipeline and by an
  # ejected-and-`npm run build`-from-scratch Astro project (ADR-0010 tier
  # c) built from the same document, must be within 0.1% pixel delta. Its
  # own job for the same reason template-budgets is: this needs a real
  # `npm install` of the ejected project's own dependency tree, which is
  # slow enough that a regression here shouldn't be buried in other output.
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright's Chromium
        run: pnpm --filter @prefab/ci-checks exec playwright install --with-deps chromium
      - run: pnpm run ci:fidelity

  # SLICES.md's End-to-end list, driven against the real editor, a real
  # API and a real publish (Playwright, Chromium) — these are slice 1's
  # acceptance criteria: the slice is done when these pass, not when the
  # code looks finished.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATE_DATABASE_URL: postgres://prefab:prefab@localhost:5432/prefab_e2e
      DATABASE_URL: postgres://prefab_app:prefab_app@localhost:5432/prefab_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Create prefab/prefab_app roles and the e2e database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/db-init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE prefab_e2e OWNER prefab;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d prefab_e2e -c "GRANT CONNECT ON DATABASE prefab_e2e TO prefab_app;"
      - name: Install Playwright's Chromium
        run: pnpm --filter @prefab/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @prefab/e2e run test

  # PR #25 added the Docker Compose + Makefile dev environment (`make dev`).
  # Both real bugs it shipped with — containers writing root-owned files
  # into the bind-mounted repo, and a Node ABI mismatch corrupting
  # apps/self-host's native better-sqlite3 build — only ever surfaced by
  # actually running the stack; validating docker-compose.yml/Dockerfile
  # config wouldn't have caught either (see their comments for the fixes).
  # This job is that: build the images for real, bring the stack up, hit
  # it over HTTP, tear it down. Per dev-playbook's guidance on layering
  # checks by cost, this is an infra/integration-level check — a fresh
  # multi-container `docker compose up --build`, not a fast unit-test-layer
  # assertion — so it gets its own job, same as fidelity and e2e above.
  dev-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env the same way `make dev` does
        run: cp .env.example .env
      - name: Build and start postgres, migrate, api, editor
        run: docker compose up --build -d
      - name: Wait for the API and the editor to answer
        run: |
          api_ok=""
          editor_ok=""
          for i in $(seq 1 120); do
            if [ -z "$api_ok" ] && curl -sf http://localhost:8787/health | grep -q '"ok":true'; then
              api_ok=1
            fi
            # No docker-compose.override.yml in a fresh checkout, so the
            # editor is reached on its own directly-published port here —
            # the Traefik-fronted http://pre-fab.localhost/ path
            # (docker-compose.override.yml.example) is opt-in and has
            # nothing to do with whether this stack itself is healthy.
            if [ -z "$editor_ok" ] && curl -sf http://localhost:5173/ >/dev/null; then
              editor_ok=1
            fi
            if [ -n "$api_ok" ] && [ -n "$editor_ok" ]; then
              echo "api and editor are both up after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::stack did not come up healthy within 10 minutes (api_ok=${api_ok:-no}, editor_ok=${editor_ok:-no})"
          exit 1
      - name: Dump container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
